# Rust SDK CI — enforces the clippy gate (cycle 111; Cargo.toml [lints.clippy] all = deny).
# Born-enforced: the repo had no CI, so the gate was local-only/bypassable until now.
name: CI

on: [push, pull_request]

jobs:
  # Catch version drift at commit time, not at release time.
  #
  # The publish workflow already refuses a tag that disagrees with the manifest, but that only
  # fires on a tag push — so drift can sit in master until release day. This runs the same
  # script with no expected version, asserting only that the repo agrees with itself, on every
  # push and PR.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Declared versions agree
        run: bash .github/scripts/check-version.sh

  clippy:
    name: clippy (lint gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      # The c111 gate: clippy::all is deny-clean. NOT `-D warnings` — unwrap/expect/panic
      # are intentionally warn-level (a separate gradual-elimination effort), so promoting
      # warnings to errors would fail the build on those non-bug lints.
      # No `--locked`: Cargo.lock is gitignored (not committed), so `--locked` errors
      # "cannot create the lock file"; the gate is clippy lints, not lockfile reproducibility.
      - name: cargo clippy
        run: cargo clippy --all-targets

  audit:
    name: cargo audit (dependency advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      # Cargo.lock is gitignored — resolve fresh (what consumers get), then audit
      # that resolved graph against the RUSTSEC advisory database.
      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Install cargo-audit
        uses: taiki-e/install-action@b9b2dbfff0f381c9fe5e52c55f95c5d0486949d9  # cargo-audit

      - name: cargo audit
        run: cargo audit

  changelog:
    name: changelog entry for version bump
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate diffs against the base commit, which a shallow
      # checkout would not have.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      # If Cargo.toml's [package] version changed relative to the base commit,
      # CHANGELOG.md must carry a matching `## [<version>]` heading. No change → no-op.
      # `^version` is line-anchored, so it matches the [package] key and not
      # `rust-version` or any dependency's inline `version = `.
      # Convention: docs/SDK-RELEASE-CONVENTIONS.md in the KnishIOClientSDK monorepo.
      - name: CHANGELOG entry for the manifest version bump
        # BASE arrives via env, never interpolated into the shell text (workflow-injection hygiene).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          BASE="${BASE:-}"
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No comparable base commit — changelog gate skipped."; exit 0
          fi
          ver() { sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -1; }
          git show "$BASE:Cargo.toml" > /tmp/base-manifest 2>/dev/null || : > /tmp/base-manifest
          NEW=$(ver Cargo.toml); OLD=$(ver /tmp/base-manifest)
          if [ "$NEW" = "$OLD" ]; then echo "version unchanged ($NEW) — nothing to check."; exit 0; fi
          echo "version bumped: ${OLD:-<none>} -> $NEW"
          # index()==1 is a fixed-string match anchored at column 1: no regex escaping of the
          # version, and a deeper `### [x]` heading does NOT satisfy `## [x]` (grep -F would match it).
          if ! awk -v h="## [$NEW]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Version bumped to $NEW but CHANGELOG.md has no '## [$NEW]' entry."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $NEW"
