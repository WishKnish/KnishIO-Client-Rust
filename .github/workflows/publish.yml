# Rust SDK publish — tag-driven crates.io publish via Trusted Publishing / OIDC (cycle 177).
# Push a bare semver tag (e.g. `0.9.1`) → clippy/test gate → `cargo publish`.
#
# Auth = crates.io Trusted Publishing (OIDC) — NO long-lived CARGO_REGISTRY_TOKEN.
# rust-lang/crates-io-auth-action exchanges the GitHub id-token for a short-lived crates.io token.
# One-time maintainer setup: crates.io → the `knishio-client` crate → Settings → Trusted Publishing →
#   add GitHub Actions: owner `WishKnish`, repository `KnishIO-Client-Rust`, workflow `publish.yml`.
#   (The crate's first release was published manually, which trusted publishing requires.)
name: Publish

on:
  push:
    tags:
      - '[0-9]*'
  # Dry run. This workflow is otherwise reachable only by pushing a tag, which publishes —
  # so every change to it (the version gate, an action bump) would ship unexercised. A
  # dispatch runs the gate and the full build/test path and stops before anything leaves the
  # runner, because the publish job is guarded on `github.event_name == 'push'`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to dry-run the gate against, e.g. 0.9.4. Publishes NOTHING.'
        required: true
        type: string

permissions:
  id-token: write   # OIDC for crates.io Trusted Publishing
  contents: write   # create the GitHub Release

jobs:
  # Split out of the publish job on purpose: `environment: release` is a deployment gate that
  # can require approval, and a dry run that uploads nothing should not have to pass it.
  verify:
    name: verify version + lint + test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Refuse to publish a tag the manifest does not itself claim. Shared definition with
      # CI and with local runs — see .github/scripts/check-version.sh.
      - name: Verify tag matches the declared SDK version
        id: version
        # DISPATCH_TAG arrives via env, never interpolated into the shell text — a
        # workflow_dispatch input is attacker-controllable text and `${{ }}` inside `run:`
        # is substituted before bash ever sees it (workflow-injection hygiene).
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            EXPECTED="${GITHUB_REF#refs/tags/}"
          else
            EXPECTED="$DISPATCH_TAG"
          fi
          bash .github/scripts/check-version.sh "$EXPECTED"

      - name: Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      # Gate — never publish a tag that doesn't lint/build/test clean.
      - name: cargo clippy (lint gate)
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test

  publish:
    name: publish to crates.io (Trusted Publishing)
    needs: verify
    if: github.event_name == 'push'   # dispatch = dry run; never publishes
    runs-on: ubuntu-latest
    environment: release   # matches the crates.io trusted-publisher Environment + the repo's `release` env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Release body = this tag's CHANGELOG.md section, NOT generate_release_notes.
      # generate_release_notes builds "What's Changed" from merged PULL REQUESTS in the tag
      # range. Releases here land as direct pushes to master, so in 0.9.4..0.9.5 the only PR
      # was a dependabot checkout bump — and the 0.9.5 release page therefore advertised a CI
      # bump while saying nothing about the secret-storage work that release actually shipped.
      # The curated CHANGELOG entry is the source of truth; extract it and use it verbatim.
      #
      # This runs BEFORE `cargo publish` on purpose. The empty-section guard below is only
      # useful if it aborts ahead of the irreversible upload; after it, a missing CHANGELOG
      # entry would leave a published crate with no release page at all — the same half-state
      # this step exists to prevent. Extraction needs nothing but the checkout.
      - name: Extract this tag's CHANGELOG section
        env:
          TAG_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Print from `## [<version>]` up to (not including) the next `## ` heading.
          awk -v ver="## [$TAG_VERSION]" '
            index($0, ver) == 1 { inside = 1; print; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error file=CHANGELOG.md::No '## [$TAG_VERSION]' section found — refusing to publish with empty release notes."
            exit 1
          fi
          echo "Release notes for $TAG_VERSION:"
          cat /tmp/release-notes.md

      # OIDC: exchange the GitHub id-token for a short-lived crates.io token (no stored secret).
      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1
        id: auth

      # cargo publish re-verifies the package builds from the packaged sources before upload.
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          # `generate_release_notes` stays OFF, deliberately — do not "helpfully" restore it.
          # The action appends the WHOLE generated block (`<body>\n\n<notes>`, see
          # src/github.ts prepareReleaseMutation), which would put a
          # "What's Changed: bump actions/checkout (dependabot)" bullet back on the page:
          # the exact misleading content this step removes, merely demoted below the fold.
          # The one part worth keeping was the "Full Changelog" compare link, and
          # synthesizing that needs the previous tag — i.e. fetch-depth: 0 on a publish
          # job — which is not worth a full-history clone for a cosmetic link.
          body_path: /tmp/release-notes.md
